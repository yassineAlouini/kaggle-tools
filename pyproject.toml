[project]
name = "kaggle-tools"
version = "0.1.0"
description = "Battle-tested utilities (and Claude Code skills) for Kaggle competitions"
authors = [{ name = "Yassine Alouini", email = "yassinealouini@outlook.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["kaggle", "machine-learning", "data-science", "competition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Optional integrations. The core package never imports these at module level.
tracking = ["trackio>=0.30"]
tune = ["optuna>=4.0"]
gbdt = ["lightgbm>=4.5", "xgboost>=2.1", "catboost>=1.2"]

[project.scripts]
kt = "kaggle_tools.cli:main"

[project.urls]
Homepage = "https://github.com/yassineAlouini/kaggle-tools"
Repository = "https://github.com/yassineAlouini/kaggle-tools"
Issues = "https://github.com/yassineAlouini/kaggle-tools/issues"
Changelog = "https://github.com/yassineAlouini/kaggle-tools/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16",
    "ty>=0.0.1a20",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "NPY", "PD", "PT"]
ignore = [
    "RUF002", # allow unicode (e.g. ×, µ) in docstrings
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PD", "PT018"]
